
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470">
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#0b1c32"/>
    <stop offset="1" stop-color="#020711"/>
  </linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#285f89"/>
    <stop offset=".5" stop-color="#102e4e"/>
    <stop offset="1" stop-color="#071629"/>
  </linearGradient>
  <linearGradient id="hood" x2="1" y2="1">
    <stop stop-color="#397ba5"/>
    <stop offset="1" stop-color="#0b2038"/>
  </linearGradient>
  <linearGradient id="cap" x2="0" y2="1">
    <stop stop-color="#367da9"/>
    <stop offset="1" stop-color="#102d4a"/>
  </linearGradient>
  <linearGradient id="metal" x2="0" y2="1">
    <stop stop-color="#e3f3ff"/>
    <stop offset=".5" stop-color="#91a9bf"/>
    <stop offset="1" stop-color="#344b64"/>
  </linearGradient>
  <linearGradient id="screen" x2="0" y2="1">
    <stop stop-color="#123655"/>
    <stop offset="1" stop-color="#030b16"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="700" height="470" rx="18" fill="url(#bg)"/>
<circle cx="350" cy="210" r="190" fill="#007bff" opacity=".08"/>
<path d="M25 65H115V95H145M675 65H585V95H555"
