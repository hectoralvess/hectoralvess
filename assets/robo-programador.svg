<path d="M25 365H110V340H145M675 365H590V340H555"
      fill="none" stroke="#087bb4" opacity=".5"/>
<g fill="#00dfff" filter="url(#glow)">
  <circle cx="145" cy="95" r="3"/>
  <circle cx="555" cy="95" r="3"/>
  <circle cx="145" cy="340" r="3"/>
  <circle cx="555" cy="340" r="3"/>
</g>

<!-- FLOATING CODE -->
<g font-family="monospace" font-size="10">
  <text x="28" y="145" fill="#00dfff">Python / AI</text>
  <text x="28" y="163" fill="#8ebbe0">model.train()</text>
  <text x="28" y="181" fill="#6ee5b5">status: coding</text>
  <text x="548" y="145" fill="#d3a5ff">Machine</text>
  <text x="548" y="163" fill="#00dfff">Learning</text>
  <text x="548" y="181" fill="#6ee5b5">Deep Learning</text>
</g>

<!-- ANIMATED HEAD -->
