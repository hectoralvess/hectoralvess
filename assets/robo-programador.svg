        keyTimes="0;.86;.90;.94;1"
        dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="371" cy="174" rx="4" ry="7" fill="#ffffff">
      <animate attributeName="opacity"
        values="1;1;0;1;1"
        keyTimes="0;.86;.90;.94;1"
