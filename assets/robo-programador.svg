
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#091b31"/>
    <stop offset="1" stop-color="#020813"/>
  </linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#24577e"/>
    <stop offset=".5" stop-color="#102d4b"/>
    <stop offset="1" stop-color="#071629"/>
  </linearGradient>
  <linearGradient id="hood" x2="1" y2="1">
    <stop stop-color="#326e98"/>
    <stop offset="1" stop-color="#0a2038"/>
  </linearGradient>
  <linearGradient id="metal" x2="0" y2="1">
    <stop stop-color="#e1f2ff"/>
    <stop offset=".5" stop-color="#819eb8"/>
    <stop offset="1" stop-color="#304a65"/>
  </linearGradient>
  <linearGradient id="screen" x2="0" y2="1">
    <stop stop-color="#102d49"/>
    <stop offset="1" stop-color="#030b16"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="720" height="440" rx="18" fill="url(#bg)"/>
<circle cx="360" cy="205" r="180" fill="#007bff" opacity=".07"/>
<path d="M25 50H145M575 50H695M25 390H145M575 390H695" stroke="#087bb4" opacity=".5"/>
<g fill="#00dfff">
  <circle cx="65" cy="50" r="3"/>
  <circle cx="655" cy="50" r="3"/>
  <circle cx="65" cy="390" r="3"/>
  <circle cx="655" cy="390" r="3"/>
</g>

<!-- Floating code -->
<g font-family="monospace" font-size="10">
  <text x="38" y="125" fill="#00dfff">print("Hello AI")</text>
  <text x="38" y="143" fill="#9cbaff">model.train()</text>
  <text x="38" y="161" fill="#6ee5b5">status: coding</text>
  <text x="555" y="125" fill="#d3a5ff">Python</text>
  <text x="555" y="143" fill="#00dfff">Machine Learning</text>
  <text x="555" y="161" fill="#6ee5b5">Deep Learning</text>
</g>

<!-- Hoodie hood -->
<path d="M250 183 Q238 75 360 70 Q482 75 470 183
L510 300 Q360 342 210 300Z"
fill="url(#hood)" stroke="#397ba7" stroke-width="3"/>
<path d="M274 177 Q280 100 360 91 Q440 100 446 177"
fill="none" stroke="#669fc2" stroke-width="4"/>
<path d="M287 168 Q360 125 433 168 L453 277
Q360 318 267 277Z"
fill="#071629" stroke="#32658a" stroke-width="3"/>

<!-- Robot head -->
<rect x="298" y="108" width="124" height="130" rx="40"
fill="url(#metal)" stroke="#b8d8ee" stroke-width="2"/>
<path d="M309 151 Q360 130 411 151 V201
Q360 228 309 201Z"
fill="#061525" stroke="#3a7da7" stroke-width="2"/>

<!-- Face -->
<path d="M328 169H348M372 169H392"
stroke="#00eaff" stroke-width="7" stroke-linecap="round"
filter="url(#glow)">
  <animate attributeName="opacity"
    values="1;1;.15;1"
    keyTimes="0;.88;.92;1"
    dur="5s" repeatCount="indefinite"/>
</path>
<path d="M347 191 Q360 198 373 191"
fill="none" stroke="#52c7e9" stroke-width="2"/>

<!-- Headphones -->
<path d="M290 161 Q270 75 360 80 Q450 75 430 161"
fill="none" stroke="#91b9d4" stroke-width="9"/>
<rect x="278" y="148" width="21" height="52" rx="8"
fill="#1b4364" stroke="#70b5d9" stroke-width="2"/>
<rect x="421" y="148" width="21" height="52" rx="8"
fill="#1b4364" stroke="#70b5d9" stroke-width="2"/>
<circle cx="288" cy="174" r="4" fill="#00dfff" filter="url(#glow)"/>
<circle cx="432" cy="174" r="4" fill="#00dfff" filter="url(#glow)"/>

<!-- Hoodie body -->
<path d="M285 230 Q250 237 225 270
L190 365 Q360 410 530 365
L495 270 Q470 237 435 230
L400 250 H320Z"
fill="url(#hoodie)" stroke="#397ba5" stroke-width="3"/>

<!-- Hoodie shoulder details -->
<path d="M260 260L226 350M460 260L494 350"
stroke="#397ba5" stroke-width="3" opacity=".7"/>
<path d="M285 244Q360 276 435 244"
fill="none" stroke="#5b94b7" stroke-width="2"/>

<!-- Hoodie strings -->
<path d="M333 237L324 296M387 237L396 296"
stroke="#a3c8e0" stroke-width="3" stroke-linecap="round"/>
<circle cx="324" cy="297" r="4" fill="#00cfff"/>
<circle cx="396" cy="297" r="4" fill="#00cfff"/>

<!-- Hoodie pocket -->
<path d="M294 319Q360 345 426 319L414 367
Q360 384 306 367Z"
fill="#0a2038" stroke="#326b93" stroke-width="2"/>
<path d="M306 329Q360 350 414 329"
fill="none" stroke="#5488ad" stroke-width="2"/>

<!-- Hoodie logo -->
<path d="M345 277L360 263L375 277L360 291Z"
fill="none" stroke="#00dfff" stroke-width="2"/>
<text x="360" y="281" text-anchor="middle"
font-size="8" font-family="monospace" fill="#b8f8ff">AI</text>

<!-- Sleeves -->
<path d="M238 270Q210 280 204 325L250 352L290 321"
fill="none" stroke="#102d4d" stroke-width="32" stroke-linecap="round"/>
<path d="M482 270Q510 280 516 325L470 352L430 321"
fill="none" stroke="#102d4d" stroke-width="32" stroke-linecap="round"/>
<path d="M238 270Q210 280 204 325M482 270Q510 280 516 325"
fill="none" stroke="#397ba5" stroke-width="2"/>

<!-- Robotic hands -->
<path d="M250 345L273 354L288 372L272 382L246 365Z"
fill="url(#metal)" stroke="#a6c9e1" stroke-width="2"/>
<path d="M470 345L447 354L432 372L448 382L474 365Z"
fill="url(#metal)" stroke="#a6c9e1" stroke-width="2"/>

<!-- Laptop -->
<rect x="247" y="286" width="226" height="125" rx="9"
fill="#172f49" stroke="#7da9c9" stroke-width="3"/>
<rect x="258" y="297" width="204" height="99" rx="4"
fill="url(#screen)" stroke="#176c9d"/>
<rect x="258" y="297" width="204" height="15" rx="4" fill="#163b5b"/>
<circle cx="269" cy="304" r="2.5" fill="#ff6677"/>
<circle cx="278" cy="304" r="2.5" fill="#ffd16c"/>
<circle cx="287" cy="304" r="2.5" fill="#50e5ad"/>

<!-- Code on screen -->
<g font-family="monospace" font-size="9">
  <text x="271" y="329" fill="#d3a5ff">def</text>
  <text x="291" y="329" fill="#75dfff"> build_ai():</text>
  <text x="280" y="344" fill="#8eb4d3">model = NeuralNet()</text>
  <text x="280" y="359" fill="#6ee5b5">model.train(data)</text>
  <text x="280" y="374" fill="#8eb4d3">return accuracy</text>
  <rect x="280" y="381" width="5" height="9" fill="#00eaff">
    <animate attributeName="opacity" values="1;0;1"
      dur=".8s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Typing hands animation -->
<g>
  <animateTransform attributeName="transform" type="translate"
    values="0 0;0 3;0 0" dur=".35s" repeatCount="indefinite"/>
  <path d="M274 379L280 387M526 379L520 387"
    stroke="#e0f5ff" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Desk -->
<path d="M110 397H610" stroke="#527493" stroke-width="5" stroke-linecap="round"/>
<path d="M150 402V420M570 402V420" stroke="#294661" stroke-width="7"/>

<!-- Status lights -->
<circle cx="180" cy="290" r="4" fill="#00dfff" filter="url(#glow)">
  <animate attributeName="opacity" values=".2;1;.2"
    dur="1.5s" repeatCount="indefinite"/>
</circle>
<circle cx="540" cy="290" r="4" fill="#00dfff" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.2;1"
    dur="1.8s" repeatCount="indefinite"/>
</circle>

<!-- Footer -->
<text x="360" y="430" text-anchor="middle"
fill="#7edfff" font-size="10" font-family="monospace"
letter-spacing="3">HOODIE DEVELOPER // ONLINE</text>
</svg>
