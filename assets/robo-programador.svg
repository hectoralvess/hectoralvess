<!-- PYTHON CODE -->
<g font-family="monospace" font-size="9">
  <text x="261" y="342" fill="#d3a5ff">def</text>
  <text x="282" y="342" fill="#75dfff"> build_ai():</text>
  <text x="270" y="357" fill="#8eb4d3">model = NeuralNet()</text>
  <text x="270" y="372" fill="#6ee5b5">model.train(data)</text>
  <text x="270" y="387" fill="#8eb4d3">return accuracy</text>
  <rect x="270" y="390" width="5" height="7" fill="#00eaff">
    <animate attributeName="opacity"
      values="1;0;1" dur=".6s"
      repeatCount="indefinite"/>
  </rect>
</g>

